
name: Build Shahadati APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q shahadati_android_project.zip
          cp -a shahadati_android/app .
          cp -a shahadati_android/build.gradle .
          cp -a shahadati_android/settings.gradle .
          cp -a shahadati_android/gradle.properties .

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shahadati-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
